name: SkyWatch feed reachability test
on:
  push:
    branches: [skywatch-live]
    paths: ['.github/workflows/feed-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe feeds
        run: |
          UA="SkyWatch snapshot (babusovereign.com)"
          probe() { echo "== $1"; curl -s -o /tmp/out -w "status=%{http_code} bytes=%{size_download} time=%{time_total}s\n" -A "$UA" --max-time 60 "${@:2}"; head -c 200 /tmp/out; echo; }
          probe adsb.lol-point https://api.adsb.lol/v2/point/37.6/-122.3/100
          probe adsb.lol-mil https://api.adsb.lol/v2/mil
          probe airplanes.live https://api.airplanes.live/v2/point/37.6/-122.3/100
          probe adsb.fi https://opendata.adsb.fi/api/v2/lat/37.6/lon/-122.3/dist/100
          probe opensky-world https://opensky-network.org/api/states/all
          probe adsb.lol-routeset -X POST -H 'Content-Type: application/json' -d '{"planes":[{"callsign":"UAL1","lat":37.6,"lng":-122.3},{"callsign":"DAL636","lat":37.5,"lng":-123.1}]}' https://api.adsb.lol/api/0/routeset
